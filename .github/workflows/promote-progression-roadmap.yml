name: Promote Verified Progression Roadmap

on:
  workflow_run:
    workflows: ["Progression 0.77-0.79 Final Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote only verified roadmap steps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text()
          text = text.replace("## Current build: 0.76", "## Current build: 0.79")
          text = text.replace("- [ ] 0.77 Authoritative co-op replication for progression, equipment, spells and quest-chain state", "- [x] 0.77 Authoritative co-op replication for progression, equipment, spells and quest-chain state")
          text = text.replace("- [ ] 0.78 Save migration, balance coverage and end-to-end progression regression gates", "- [x] 0.78 Save migration, balance coverage and end-to-end progression regression gates")
          text = text.replace("- [ ] 0.79 Progression/Magic/Equipment/Quest Chains integration and polish pass", "- [x] 0.79 Progression/Magic/Equipment/Quest Chains integration and polish pass")
          path.write_text(text)
          PY

      - name: Commit verified promotion
        shell: bash
        run: |
          if git diff --quiet -- ROADMAP.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Verify progression roadmap through 0.79 [skip ci]"
          git push origin main
