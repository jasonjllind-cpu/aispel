name: Godot Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-check:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project and check scripts
        run: godot --headless --path . --editor --quit
