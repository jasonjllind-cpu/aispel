name: Godot Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-check:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project and check scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-editor.log
          ERRORS="$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:|^ERROR:" godot-editor.log | grep -v 'ERROR: Parameter "m" is null\.' || true)"
          if [ -n "$ERRORS" ]; then
            while IFS= read -r line; do
              echo "::error title=Godot import/script check::$line"
            done <<< "$ERRORS"
            echo "Godot editor/script errors detected"
            exit 1
          fi

      - name: Verify deterministic world generation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/generation_determinism_test.gd 2>&1 | tee godot-generation.log
          grep -q "GENERATION_DETERMINISM_OK" godot-generation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-generation.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Generation test errors detected"
            exit 1
          fi

      - name: Verify scalable macro world graph
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_graph_generator_test.gd 2>&1 | tee godot-world-graph.log
          grep -q "WORLD_GRAPH_OK" godot-world-graph.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-world-graph.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Macro world graph errors detected"
            exit 1
          fi

      - name: Verify world runtime foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_runtime_foundation_test.gd 2>&1 | tee godot-foundation.log
          grep -q "WORLD_RUNTIME_FOUNDATION_OK" godot-foundation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-foundation.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World runtime foundation errors detected"
            exit 1
          fi

      - name: Verify NPC runtime foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/npc_foundation_test.gd 2>&1 | tee godot-npc.log
          grep -q "NPC_FOUNDATION_OK" godot-npc.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-npc.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "NPC runtime foundation errors detected"
            exit 1
          fi

      - name: Verify Living World foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/living_world_foundation_test.gd 2>&1 | tee godot-living-world.log
          grep -q "LIVING_WORLD_FOUNDATION_OK" godot-living-world.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-living-world.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Living World foundation errors detected"
            exit 1
          fi

      - name: Verify Living World gameplay flow
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/living_world_flow_test.gd 2>&1 | tee godot-living-flow.log
          grep -q "LIVING_WORLD_FLOW_OK" godot-living-flow.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-living-flow.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Living World gameplay flow errors detected"
            exit 1
          fi

      - name: Verify dungeon foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/dungeon_foundation_test.gd 2>&1 | tee godot-dungeon.log
          grep -q "DUNGEON_FOUNDATION_OK" godot-dungeon.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-dungeon.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Dungeon foundation errors detected"
            exit 1
          fi

      - name: Verify dungeon runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/dungeon_runtime_test.gd 2>&1 | tee godot-dungeon-runtime.log
          grep -q "DUNGEON_RUNTIME_OK" godot-dungeon-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-dungeon-runtime.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Dungeon runtime errors detected"
            exit 1
          fi

      - name: Verify save game service
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/save_game_service_test.gd 2>&1 | tee godot-save.log
          grep -q "SAVE_GAME_SERVICE_OK" godot-save.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-save.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Save game service errors detected"
            exit 1
          fi

      - name: Verify full session persistence
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/game_persistence_system_test.gd 2>&1 | tee godot-session-save.log
          grep -q "GAME_PERSISTENCE_OK" godot-session-save.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-session-save.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Full session persistence errors detected"
            exit 1
          fi

      - name: Verify co-op network foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_session_foundation_test.gd 2>&1 | tee godot-network.log
          grep -q "NETWORK_SESSION_FOUNDATION_OK" godot-network.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Co-op network foundation errors detected"
            exit 1
          fi

      - name: Verify authoritative network commands
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_command_router_test.gd 2>&1 | tee godot-network-commands.log
          grep -q "NETWORK_COMMAND_ROUTER_OK" godot-network-commands.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network-commands.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Authoritative network command errors detected"
            exit 1
          fi

      - name: Verify co-op player replication
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_player_manager_test.gd 2>&1 | tee godot-network-players.log
          grep -q "NETWORK_PLAYER_MANAGER_OK" godot-network-players.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network-players.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Co-op player replication errors detected"
            exit 1
          fi

      - name: Verify authoritative WorldState replication
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_world_state_replicator_test.gd 2>&1 | tee godot-network-world.log
          grep -q "NETWORK_WORLD_STATE_OK" godot-network-world.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network-world.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Authoritative WorldState replication errors detected"
            exit 1
          fi

      - name: Verify server authoritative combat
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_combat_authority_test.gd 2>&1 | tee godot-network-combat.log
          grep -q "NETWORK_COMBAT_AUTHORITY_OK" godot-network-combat.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network-combat.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Server authoritative combat errors detected"
            exit 1
          fi

      - name: Verify enemy replication
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/network_enemy_manager_test.gd 2>&1 | tee godot-network-enemies.log
          grep -q "NETWORK_ENEMY_MANAGER_OK" godot-network-enemies.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-network-enemies.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Enemy replication errors detected"
            exit 1
          fi

      - name: Launch main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee godot-game.log
          # Godot 4.3 dummy renderer may emit this exact benign message for
          # presentation meshes in headless mode. Every other ERROR stays fatal.
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" godot-game.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Godot runtime errors detected"
            exit 1
          fi
