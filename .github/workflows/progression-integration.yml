name: Progression Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: progression-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progression-integration:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify progression integration and polish
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/progression_integration_test.gd 2>&1 | tee progression-integration.log
          grep -q "PROGRESSION_INTEGRATION_OK" progression-integration.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-integration.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Progression integration errors detected"
            exit 1
          fi
