name: Build STL 3D Visare v1.2.2

on:
  pull_request:
    branches:
      - chatgpt-stl-viewer-build-20260906

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify and unpack v1.2.2 source
        run: |
          echo "0efe5ee6c8a1eac2f8e18e29c24ea6cac96959c74cde533c42a41149d5fe51b1  .github/stlviewer-v122-source.zip" | sha256sum -c -
          unzip -t .github/stlviewer-v122-source.zip
          unzip -q .github/stlviewer-v122-source.zip
          grep -q 'versionName = "1.2.2"' STLViewerAndroid_v1_2_2/app/build.gradle.kts
          ! grep -q 'SplashActivity' STLViewerAndroid_v1_2_2/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' STLViewerAndroid_v1_2_2/app/src/main/AndroidManifest.xml
          grep -q 'splash_overlay' STLViewerAndroid_v1_2_2/app/src/main/res/layout/activity_main.xml
          grep -q 'showStartupOverlay' STLViewerAndroid_v1_2_2/app/src/main/java/se/johan/stlviewer/MainActivity.java

      - name: Build debug APK
        working-directory: STLViewerAndroid_v1_2_2
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          unzip -t STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          file STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          sha256sum STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STL-3D-Visare-v1.2.2-debug-apk
          path: STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
