name: World Graph Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: world-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-graph:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check distribution planner syntax
        shell: bash
        run: |
          set +e
          godot --headless --path . --check-only --script res://scripts/world/world_distribution_planner.gd 2>&1 | tee distribution-syntax.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            while IFS= read -r line; do
              SAFE_LINE="${line//'%'/'%25'}"
              echo "::error title=Distribution planner syntax::$SAFE_LINE"
            done < distribution-syntax.log
            exit "$STATUS"
          fi

      - name: Verify macro graph determinism and connectivity
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_graph_generator_test.gd 2>&1 | tee graph.log
          grep -q "WORLD_GRAPH_OK" graph.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" graph.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World graph generation errors detected"
            exit 1
          fi

      - name: Verify generated region streaming lifecycle
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_graph_runtime_test.gd 2>&1 | tee graph-runtime.log
          grep -q "WORLD_GRAPH_RUNTIME_OK" graph-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" graph-runtime.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World graph runtime errors detected"
            exit 1
          fi

      - name: Verify graph-aware region content profiles
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/region_content_profile_test.gd 2>&1 | tee region-content.log
          grep -q "REGION_CONTENT_PROFILE_OK" region-content.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" region-content.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Region content profile errors detected"
            exit 1
          fi

      - name: Verify route hierarchy gateways and shortcuts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_route_planner_test.gd 2>&1 | tee world-routes.log
          grep -q "WORLD_ROUTE_PLANNER_OK" world-routes.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" world-routes.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World route planner errors detected"
            exit 1
          fi

      - name: Verify hierarchical subregion graphs
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/subregion_graph_test.gd 2>&1 | tee subregion-graph.log
          grep -q "SUBREGION_GRAPH_OK" subregion-graph.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" subregion-graph.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Subregion graph errors detected"
            exit 1
          fi

      - name: Verify topology-aware streaming priorities
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_streaming_planner_test.gd 2>&1 | tee streaming-plan.log
          grep -q "WORLD_STREAMING_PLANNER_OK" streaming-plan.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" streaming-plan.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World streaming planner errors detected"
            exit 1
          fi

      - name: Verify macro world distribution constraints
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_distribution_planner_test.gd 2>&1 | tee distribution-plan.log
          grep -q "WORLD_DISTRIBUTION_PLANNER_OK" distribution-plan.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" distribution-plan.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World distribution planner errors detected"
            exit 1
          fi

      - name: Verify multi-scale regeneration stress
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/world_graph_stress_test.gd 2>&1 | tee graph-stress.log
          grep -q "WORLD_GRAPH_STRESS_OK" graph-stress.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" graph-stress.log | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "World graph stress errors detected"
            exit 1
          fi
