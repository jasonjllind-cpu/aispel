name: Build STL 3D Visare v1.2

on:
  pull_request:
    branches:
      - chatgpt-stl-viewer-build-20260906

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Recover STL 3D Visare v1.2 project
        shell: bash
        run: |
          cat \
            .github/stlviewer-v12-parts/part00.b64 \
            .github/stlviewer-v12-parts/part01.b64 \
            .github/stlviewer-v12-parts/part02.b64 \
            .github/stlviewer-v12-parts/part03.b64 \
            .github/stlviewer-v12-parts/part04a.b64 \
            .github/stlviewer-v12-parts/part04b.b64 \
            .github/stlviewer-v12-parts/part05.b64 \
            .github/stlviewer-v12-parts/part06.b64 \
            | tr -d '\n\r ' | base64 --decode > /tmp/stl3d-v12.zip
          unzip -t /tmp/stl3d-v12.zip
          unzip -q /tmp/stl3d-v12.zip
          test -f STLViewerAndroid_v1_2/app/build.gradle.kts
          grep -q 'versionName = "1.2"' STLViewerAndroid_v1_2/app/build.gradle.kts
          grep -q 'STL 3D Visare' STLViewerAndroid_v1_2/app/src/main/res/values/strings.xml
          test -f STLViewerAndroid_v1_2/app/src/main/java/se/johan/stlviewer/SplashActivity.java

      - name: Build debug APK
        working-directory: STLViewerAndroid_v1_2
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK='STLViewerAndroid_v1_2/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q resources.arsc

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STL-3D-Visare-v1.2-debug-apk
          path: STLViewerAndroid_v1_2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
