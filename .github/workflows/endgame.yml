name: Endgame Progression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: endgame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endgame:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify campaign progression graph
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/campaign_progression_catalog_test.gd 2>&1 | tee campaign-progression.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 campaign-progression.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Campaign progression Godot failure::$message"
            exit "$status"
          fi
          grep -q "CAMPAIGN_PROGRESSION_CATALOG_OK" campaign-progression.log
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" campaign-progression.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then echo "::error title=Campaign progression script errors::$errors"; exit 1; fi

      - name: Verify endgame region access
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/endgame_region_access_test.gd 2>&1 | tee endgame-region-access.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 endgame-region-access.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame region access Godot failure::$message"
            exit "$status"
          fi
          grep -q "ENDGAME_REGION_ACCESS_OK" endgame-region-access.log
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" endgame-region-access.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then echo "::error title=Endgame region access script errors::$errors"; exit 1; fi

      - name: Verify authoritative boss progression
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/boss_progression_contract_test.gd 2>&1 | tee boss-progression.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 boss-progression.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Boss progression Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "BOSS_PROGRESSION_CONTRACT_OK" boss-progression.log; then
            message=$(tail -n 30 boss-progression.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Boss progression marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" boss-progression.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Boss progression script errors::$message"
            exit 1
          fi

      - name: Verify deterministic endgame relic objectives
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/endgame_relic_objectives_test.gd 2>&1 | tee endgame-relic-objectives.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 endgame-relic-objectives.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame relic objective Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "ENDGAME_RELIC_OBJECTIVES_OK" endgame-relic-objectives.log; then
            message=$(tail -n 30 endgame-relic-objectives.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame relic objective marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" endgame-relic-objectives.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame relic objective script errors::$message"
            exit 1
          fi

      - name: Verify faction and ending choice consequences
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/endgame_choice_consequences_test.gd 2>&1 | tee endgame-choice-consequences.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 endgame-choice-consequences.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame choice consequence Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "ENDGAME_CHOICE_CONSEQUENCES_OK" endgame-choice-consequences.log; then
            message=$(tail -n 30 endgame-choice-consequences.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame choice consequence marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" endgame-choice-consequences.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame choice consequence script errors::$message"
            exit 1
          fi

      - name: Verify persistent deterministic postgame world profile
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/postgame_world_profile_test.gd 2>&1 | tee postgame-world-profile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 postgame-world-profile.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Postgame world profile Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "POSTGAME_WORLD_PROFILE_OK" postgame-world-profile.log; then
            message=$(tail -n 30 postgame-world-profile.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Postgame world profile marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" postgame-world-profile.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Postgame world profile script errors::$message"
            exit 1
          fi

      - name: Verify authoritative co-op endgame replication
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/network_endgame_replicator_test.gd 2>&1 | tee network-endgame-replicator.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 network-endgame-replicator.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Network endgame replicator Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "NETWORK_ENDGAME_REPLICATOR_OK" network-endgame-replicator.log; then
            message=$(tail -n 30 network-endgame-replicator.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Network endgame replicator marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" network-endgame-replicator.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Network endgame replicator script errors::$message"
            exit 1
          fi
