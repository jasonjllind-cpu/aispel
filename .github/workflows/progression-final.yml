name: Progression 0.77-0.79 Final Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: progression-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-progression-gate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify authoritative progression networking
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/network_progression_replicator_test.gd 2>&1 | tee progression-networking.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 progression-networking.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression networking Godot failure::$message"
            exit "$status"
          fi
          grep -q "NETWORK_PROGRESSION_REPLICATOR_OK" progression-networking.log
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-networking.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression networking script errors::$message"
            exit 1
          fi

      - name: Verify progression save migration and balance coverage
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/progression_save_migration_test.gd 2>&1 | tee progression-save.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 progression-save.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression save migration Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "PROGRESSION_SAVE_MIGRATION_OK" progression-save.log; then
            message=$(tail -n 30 progression-save.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression save migration marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-save.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression save migration script errors::$message"
            exit 1
          fi

      - name: Verify progression integration and polish
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/progression_integration_test.gd 2>&1 | tee progression-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 progression-integration.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression integration Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "PROGRESSION_INTEGRATION_OK" progression-integration.log; then
            message=$(tail -n 30 progression-integration.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression integration marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-integration.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Progression integration script errors::$message"
            exit 1
          fi
