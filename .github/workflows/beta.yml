name: Beta Optimization Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtime performance telemetry and budgets
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/runtime_performance_budget_test.gd 2>&1 | tee runtime-performance.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 runtime-performance.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Runtime performance Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "RUNTIME_PERFORMANCE_BUDGET_OK" runtime-performance.log; then
            message=$(tail -n 40 runtime-performance.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Runtime performance marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" runtime-performance.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Runtime performance script errors::$message"
            exit 1
          fi

      - name: Verify bounded streaming memory and pooling
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/streaming_memory_optimization_test.gd 2>&1 | tee streaming-memory.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 streaming-memory.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Streaming memory Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "STREAMING_MEMORY_OPTIMIZATION_OK" streaming-memory.log; then
            message=$(tail -n 40 streaming-memory.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Streaming memory marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" streaming-memory.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Streaming memory script errors::$message"
            exit 1
          fi

      - name: Verify deterministic and distinct world generation v2
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 45s godot --headless --path . --script res://scripts/tests/world_generator_v2_test.gd 2>&1 | tee world-generator-v2.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 60 world-generator-v2.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=World generator v2 Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "WORLD_GENERATOR_V2_OK" world-generator-v2.log; then
            message=$(tail -n 60 world-generator-v2.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=World generator v2 marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" world-generator-v2.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=World generator v2 script errors::$message"
            exit 1
          fi
