name: Progression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: progression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progression:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify persistent player progression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/player_progression_state_test.gd 2>&1 | tee player-progression.log
          grep -q "PLAYER_PROGRESSION_STATE_OK" player-progression.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" player-progression.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify data-driven spell catalog
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/spell_catalog_test.gd 2>&1 | tee spell-catalog.log
          grep -q "SPELL_CATALOG_OK" spell-catalog.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" spell-catalog.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify deterministic equipment progression
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://scripts/tests/equipment_progression_test.gd 2>&1 | tee equipment-progression.log
          grep -q "EQUIPMENT_PROGRESSION_OK" equipment-progression.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" equipment-progression.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify quest chain graph
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/quest_chain_catalog_test.gd 2>&1 | tee quest-chain.log
          grep -q "QUEST_CHAIN_CATALOG_OK" quest-chain.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" quest-chain.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify magic school progression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/magic_school_progression_test.gd 2>&1 | tee magic-school.log
          grep -q "MAGIC_SCHOOL_PROGRESSION_OK" magic-school.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" magic-school.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify regional progression gates
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/regional_progression_gate_test.gd 2>&1 | tee regional-progression.log
          grep -q "REGIONAL_PROGRESSION_GATE_OK" regional-progression.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" regional-progression.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify integrated character builds
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tests/character_build_model_test.gd 2>&1 | tee character-build.log
          grep -q "CHARACTER_BUILD_MODEL_OK" character-build.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" character-build.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify authoritative progression replication
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://scripts/tests/network_progression_replicator_test.gd 2>&1 | tee network-progression.log
          grep -q "NETWORK_PROGRESSION_REPLICATOR_OK" network-progression.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" network-progression.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify progression save migration and balance coverage
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://scripts/tests/progression_save_migration_test.gd 2>&1 | tee progression-save.log
          grep -q "PROGRESSION_SAVE_MIGRATION_OK" progression-save.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-save.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi

      - name: Verify progression integration and polish
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --script res://scripts/tests/progression_integration_test.gd 2>&1 | tee progression-integration.log
          grep -q "PROGRESSION_INTEGRATION_OK" progression-integration.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" progression-integration.log | grep -v 'ERROR: Parameter "m" is null\.'; then exit 1; fi
