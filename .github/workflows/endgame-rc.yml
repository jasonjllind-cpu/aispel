name: Endgame 0.89 Release Candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: endgame-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify unified endgame bundle integration
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/endgame_integration_test.gd 2>&1 | tee endgame-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 endgame-integration.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame integration Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "ENDGAME_INTEGRATION_OK" endgame-integration.log; then
            message=$(tail -n 40 endgame-integration.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame integration marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" endgame-integration.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame integration script errors::$message"
            exit 1
          fi

      - name: Verify full endgame release candidate gameplay
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 30s godot --headless --path . --script res://scripts/tests/endgame_release_candidate_test.gd 2>&1 | tee endgame-release-candidate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 endgame-release-candidate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame RC Godot failure::$message"
            exit "$status"
          fi
          if ! grep -q "ENDGAME_RELEASE_CANDIDATE_OK" endgame-release-candidate.log; then
            message=$(tail -n 40 endgame-release-candidate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame RC marker missing::$message"
            exit 1
          fi
          errors=$(grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid assignment|Invalid access|Compile Error:|^ERROR:" endgame-release-candidate.log | grep -v 'ERROR: Parameter "m" is null\.' || true)
          if [ -n "$errors" ]; then
            message=$(printf '%s' "$errors" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Endgame RC script errors::$message"
            exit 1
          fi
