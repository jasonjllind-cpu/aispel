name: Build STL 3D Visare v1.2.3

on:
  pull_request:
    branches:
      - chatgpt-stl-viewer-build-20260906

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Recover verified v1.2.2 source
        run: |
          cat \
            .github/stlviewer-v122-parts/part00.b64 \
            .github/stlviewer-v122-parts/part01.b64 \
            .github/stlviewer-v122-parts/part02.b64 \
            .github/stlviewer-v122-parts/part03.b64 \
            .github/stlviewer-v122-parts/part04.b64 \
            .github/stlviewer-v122-parts/part05.b64 \
            .github/stlviewer-v122-parts/part06.b64 \
            .github/stlviewer-v122-parts/part07.b64 \
            | tr -d '\n\r ' | base64 --decode > /tmp/stlviewer-v122-source.zip
          echo "0efe5ee6c8a1eac2f8e18e29c24ea6cac96959c74cde533c42a41149d5fe51b1  /tmp/stlviewer-v122-source.zip" | sha256sum -c -
          unzip -q /tmp/stlviewer-v122-source.zip

      - name: Apply v1.2.3 icon update
        run: |
          cd STLViewerAndroid_v1_2_2
          sed -i 's/versionCode = 4/versionCode = 5/' app/build.gradle.kts
          sed -i 's/versionName = "1.2.2"/versionName = "1.2.3"/' app/build.gradle.kts
          sed -i 's|android:icon="@drawable/ic_app_logo"|android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
          sed -i 's|android:roundIcon="@drawable/ic_app_logo"|android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
          sed -i 's|@drawable/ic_logo_cube|@mipmap/ic_launcher|g' app/src/main/res/layout/activity_main.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; done
          cp ../.github/stlviewer-v123-icon/ic_launcher_mdpi.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_mdpi.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_hdpi.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_hdpi.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xhdpi.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xhdpi.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xxhdpi.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xxhdpi.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xxxhdpi.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ../.github/stlviewer-v123-icon/ic_launcher_xxxhdpi.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          grep -q 'versionName = "1.2.3"' app/build.gradle.kts
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: STLViewerAndroid_v1_2_2
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          unzip -t STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          unzip -l STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk | grep 'mipmap-xxxhdpi.*ic_launcher'
          file STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
          sha256sum STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STL-3D-Visare-v1.2.3-icon-debug-apk
          path: STLViewerAndroid_v1_2_2/app/build/outputs/apk/debug/app-debug.apk
